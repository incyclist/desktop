name: Windows x64 Build

# Signed release builds are started by the maintainer's release script on the signing host,
# which opens a short signing session and then dispatches this workflow with sign_windows=true.
# Without sign_windows the workflow builds an unsigned installer from the selected branch.

on:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Sign via the YubiKey signing host. Only on main, only for repository admins, and only while a signing session is open'
        type: boolean
        default: false
      tag:
        description: 'Release tag to build (required when signing; must be on main)'
        type: string
        default: ''

jobs:
  build:

    runs-on: windows-2022

    # The signer secrets live in this environment, which only the main branch may use.
    # Without signing, no environment is attached and the job runs as before.
    environment: ${{ inputs.sign_windows == true && 'windows-signing' || '' }}

    strategy:
      matrix:
        node-version: [24]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Check that signing is allowed
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if ($env:GITHUB_REF -ne 'refs/heads/main') {
          throw "Signing is only allowed on main (this run is on $env:GITHUB_REF)"
        }
        if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
          throw "Signing needs the release tag (input 'tag')"
        }
        # Both the user who started the workflow and the one who (re-)ran it must be admins
        foreach ($user in @($env:GITHUB_ACTOR, $env:GITHUB_TRIGGERING_ACTOR) | Select-Object -Unique) {
          $permission = gh api "repos/$env:GITHUB_REPOSITORY/collaborators/$user/permission" --jq .permission
          if ($permission -ne 'admin') {
            throw "Signing is only allowed for repository admins ($user has permission '$permission')"
          }
        }

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sign_windows == true && format('refs/tags/{0}', inputs.tag) || '' }}
        fetch-depth: ${{ inputs.sign_windows == true && '0' || '1' }}

    - name: Check that the tag is on main
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        git merge-base --is-ancestor HEAD origin/main
        if ($LASTEXITCODE -ne 0) { throw "Tag $env:RELEASE_TAG is not on main" }

    - name: Retrieve the settings and write them to a file
      shell: pwsh
      env:
        SETTINGS_FILE: ${{ secrets.SETTINGS_FILE }}
      run: |
        $env:SETTINGS_FILE | Out-File .\config\settings.json
        dir .\config

    - name: Prepare the signer connection
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        SIGNER_HOST: ${{ secrets.SIGNER_HOST }}
        SIGNER_PORT: ${{ secrets.SIGNER_PORT }}
        SIGNER_USER: ${{ secrets.SIGNER_USER }}
        SIGNER_SSH_KEY: ${{ secrets.SIGNER_SSH_KEY }}
        SIGNER_KNOWN_HOSTS: ${{ secrets.SIGNER_KNOWN_HOSTS }}
      run: |
        # Fail before spending build time if a secret is missing
        foreach ($name in 'SIGNER_HOST','SIGNER_PORT','SIGNER_USER','SIGNER_SSH_KEY','SIGNER_KNOWN_HOSTS') {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "$name secret is empty - cannot sign"
          }
        }
        $dir = Join-Path $env:RUNNER_TEMP 'signer'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $key = Join-Path $dir 'id_ed25519'
        $known = Join-Path $dir 'known_hosts'
        # OpenSSH needs LF line endings and refuses keys that others can read
        [IO.File]::WriteAllText($key, ($env:SIGNER_SSH_KEY.Trim() -replace "`r", '') + "`n")
        [IO.File]::WriteAllText($known, ($env:SIGNER_KNOWN_HOSTS.Trim() -replace "`r", '') + "`n")
        icacls $key /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
        "SIGNER_KEY_FILE=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "SIGNER_KNOWN_HOSTS_FILE=$known" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Build Installer
      env:
        RELEASE_SERVER: ${{ secrets.RELEASE_SERVER }}
        SIGN_WINDOWS: ${{ inputs.sign_windows }}
        SIGNER_HOST: ${{ secrets.SIGNER_HOST }}
        SIGNER_PORT: ${{ secrets.SIGNER_PORT }}
        SIGNER_USER: ${{ secrets.SIGNER_USER }}
        SIGNER_KNOWN_HOSTS: ${{ env.SIGNER_KNOWN_HOSTS_FILE }}
      run: |
        $env:BUILD_TARGET = "dist"
        npm install
        npm run make

    - name: Remove the signer key
      if: ${{ always() && inputs.sign_windows == true }}
      shell: pwsh
      run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'signer') -ErrorAction SilentlyContinue

    - name: Verify signatures
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        # Forks signing with their own certificate set the WINDOWS_SIGN_SUBJECT repository variable
        WINDOWS_SIGN_SUBJECT: ${{ vars.WINDOWS_SIGN_SUBJECT || 'CN=Guido Doumen' }}
      run: |
        # The signing hook only logs failures, so check the result explicitly.
        $expected = $env:WINDOWS_SIGN_SUBJECT
        $targets = @(
          (Get-ChildItem -Path .\out -Recurse -Filter Incyclist.exe),
          (Get-ChildItem -Path .\out -Recurse -Filter '*Setup.exe')
        )
        # Update.exe is only present inside the nupkg; Setup.exe embeds it. Check what is on disk.
        $targets += Get-ChildItem -Path .\out -Recurse -Filter Update.exe
        $targets = $targets | ForEach-Object { $_ }
        if (-not ($targets | Where-Object Name -like '*Setup.exe')) { throw "Setup.exe not found in .\out" }
        if (-not ($targets | Where-Object Name -eq 'Incyclist.exe')) { throw "Incyclist.exe not found in .\out" }
        $failed = $false
        foreach ($f in $targets) {
          $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          Write-Host "$($f.FullName): $($sig.Status) $subject"
          if ($sig.Status -ne 'Valid' -or $subject -notlike "*$expected*") { $failed = $true }
        }
        if ($failed) { throw "One or more files are not signed correctly" }

    - uses: actions/upload-artifact@v7
      # Upload even if signature verification failed, so the build can be inspected
      if: ${{ !cancelled() }}
      with:
        name: package
        path: ./out/make/squirrel.windows/x64/
