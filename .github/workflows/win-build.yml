# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Windows x64 Build

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Sign Incyclist.exe, Update.exe and Setup.exe via SSL.com eSigner (billable - uses the SSL_COM_* secrets)'
        type: boolean
        default: false

jobs:
  build:

    runs-on: windows-2022

    strategy:
      matrix:
        node-version: [24]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Retrieve the settings and write them to a file
      shell: pwsh    
      env:
        SETTINGS_FILE: ${{ secrets.SETTINGS_FILE }}
      run: |
        $env:SETTINGS_FILE | Out-File .\config\settings.json
        dir .\config

    - name: Check signing credentials
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
        SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
        SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
        SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
      run: |
        # Fail before spending build time or signings if a secret is missing
        foreach ($name in 'SSL_COM_USERNAME','SSL_COM_PASSWORD','SSL_COM_CREDENTIAL_ID','SSL_COM_TOTP_SECRET') {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "$name secret is empty - cannot sign"
          }
        }

    - name: Set up Java (for CodeSignTool)
      if: ${{ inputs.sign_windows == true }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Download CodeSignTool
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      run: |
        $version = 'v1.3.2'
        $url = "https://github.com/SSLcom/CodeSignTool/releases/download/$version/CodeSignTool-$version-windows.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\codesigntool.zip"
        Expand-Archive -Path "$env:RUNNER_TEMP\codesigntool.zip" -DestinationPath "$env:RUNNER_TEMP\codesigntool"
        $jar = Get-ChildItem -Path "$env:RUNNER_TEMP\codesigntool" -Recurse -Filter 'code_sign_tool*.jar' | Select-Object -First 1
        if (-not $jar) { throw "code_sign_tool jar not found in CodeSignTool $version archive" }
        "CODE_SIGN_TOOL_JAR=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

    - name: Build Installer
      env:
        RELEASE_SERVER: ${{ secrets.RELEASE_SERVER }}
        SIGN_WINDOWS: ${{ inputs.sign_windows }}
        SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
        SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
        SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
        SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
      run: |
        $env:BUILD_TARGET = "dist"
        npm install
        npm run make
  
    - name: Verify signatures
      if: ${{ inputs.sign_windows == true }}
      shell: pwsh
      env:
        # Forks signing with their own certificate set the WINDOWS_SIGN_SUBJECT repository variable
        WINDOWS_SIGN_SUBJECT: ${{ vars.WINDOWS_SIGN_SUBJECT || 'CN=Guido Doumen' }}
      run: |
        # The signing hook only logs failures, so check the result explicitly.
        $expected = $env:WINDOWS_SIGN_SUBJECT
        $targets = @(
          (Get-ChildItem -Path .\out -Recurse -Filter Incyclist.exe),
          (Get-ChildItem -Path .\out -Recurse -Filter Setup.exe)
        )
        # Update.exe is only present inside the nupkg; Setup.exe embeds it. Check what is on disk.
        $targets += Get-ChildItem -Path .\out -Recurse -Filter Update.exe
        $targets = $targets | ForEach-Object { $_ }
        if (-not ($targets | Where-Object Name -eq 'Setup.exe')) { throw "Setup.exe not found in .\out" }
        if (-not ($targets | Where-Object Name -eq 'Incyclist.exe')) { throw "Incyclist.exe not found in .\out" }
        $failed = $false
        foreach ($f in $targets) {
          $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          Write-Host "$($f.FullName): $($sig.Status) $subject"
          if ($sig.Status -ne 'Valid' -or $subject -notlike "*$expected*") { $failed = $true }
        }
        if ($failed) { throw "One or more files are not signed correctly" }

    - uses: actions/upload-artifact@v7
      with:
        name: package
        path: ./out/make/squirrel.windows/x64/

  